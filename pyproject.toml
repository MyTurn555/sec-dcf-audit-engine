[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-dcf-audit-engine"
version = "0.1.0"
description = "Deterministic SEC EDGAR 10-K financial ingestion, normalization, and accounting audit engine."
requires-python = ">=3.11"
dependencies = [
    "edgartools>=6.4.0",
    "google-genai>=1.0.0",
    "pydantic>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
